<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>India Got Latent — Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var cleanPath = path.replace(/^\/+/, '');
        var redirectUrl = '/' + (cleanPath ? '#' + cleanPath : '') + search + (hash && !cleanPath ? hash : '');
        window.location.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="background-color: #0a0a0f; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <div style="width: 32px; height: 32px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 0.8s linear infinite;"></div>
      <p style="font-size: 14px; font-weight: 600; color: #f59e0b; margin: 0 0 6px 0;">Loading India Got Latent...</p>
      <p style="font-size: 12px; color: #71717a; margin: 0;">Redirecting to your destination...</p>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
